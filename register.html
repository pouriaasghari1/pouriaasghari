                <li><a href="p_games.html"><i class="fas fa-home"></i> خانه</a></li>

                <p><i class="fas fa-phone-alt"></i> 09368531590</p>

    <main style="min-height: 70vh;">
        <div class="register-form">
            <h2><i class="fas fa-user-plus"></i> ثبت نام در P-GAMES</h2>
            <form id="registerForm" action="hoop.php" method="POST">
                <div class="input-group">
                    <label>نام</label>
                    <input type="text" id="firstName" name="first_name" placeholder="نام خود را وارد کنید">
                    <span class="error-msg" id="firstNameError"></span>
                </div>
                <div class="input-group">
                    <label>نام خانوادگی</label>
                    <input type="text" id="lastName" name="last_name" placeholder="نام خانوادگی">
                    <span class="error-msg" id="lastNameError"></span>
                </div>
                <div class="input-group">
                    <label>شماره تلفن</label>
                    <input type="tel" id="phone" name="phone" placeholder="مثلا 09123456789">
                    <span class="error-msg" id="phoneError"></span>
                </div>
                <button type="submit" class="btn-success btn-block">ثبت نام</button>
            </form>
            <div class="success-msg" id="successMessage" style="display: none;">
                <i class="fas fa-check-circle" style="font-size: 2rem;"></i>
                <p>ثبت نام با موفقیت انجام شد</p>
            </div>
        </div>
