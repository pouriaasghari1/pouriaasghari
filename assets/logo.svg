<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Pouria Business logo">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <linearGradient id="pb-mark" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7dfbcb"/>
      <stop offset="0.55" stop-color="#34e0a1"/>
      <stop offset="1" stop-color="#0f9e6b"/>
    </linearGradient>
    <linearGradient id="pb-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34e0a1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34e0a1" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#pb-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" fill="none" stroke="#1d2b25" stroke-width="1.5"/>

  <!-- spreadsheet grid: four columns, the backbone of the mark -->
  <g stroke="#16241f" stroke-width="1.1" stroke-linecap="round">
    <path d="M11 14.5h26M11 22h26M11 29.5h26M11 37h26"/>
    <path d="M18.75 10v28M26.5 10v28M34.25 10v28"/>
  </g>

  <!-- "P" monogram, drawn on the grid -->
  <path d="M17 34.5V14h6.6a5.8 5.8 0 0 1 0 11.6H17"
        fill="none" stroke="url(#pb-mark)" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- automation spark: the systems run themselves -->
  <g transform="translate(30.4,31.6)">
    <path d="M2.6 0 3.35 1.95 5.3 2.7 3.35 3.45 2.6 5.4 1.85 3.45 -0.1 2.7 1.85 1.95Z" fill="#8affd3"/>
  </g>

  <!-- baseline rule -->
  <path d="M11 41h26" stroke="url(#pb-rule)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
