<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p_shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
    <header>
        <div class="nav-container">
            <div class="logo">p_shop</div>

                <li><a href="tel.html" class="active">پل‌های ارتباطی</a></li>

                <span>سبد خرید</span>

        </div>

<div class="glass-box">
    <h2 style="text-align:center; margin-bottom:35px; font-weight:900; background:linear-gradient(45deg,#ff0055,#00f0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">شبکه‌های رسمی ارتباطی پوریا اصغری</h2>
    
    <div class="social-wrapper">
        <a href="https://t.me/pouriaasghari_1" target="_blank" class="social-card-item" style="--clr: #0088cc;">
            <i class="fa-brands fa-telegram"></i>
            <div style="font-weight:700; margin-top:5px;">تلگرام</div>
            <div class="handle-text">@pouriaasghari_1</div>
        </a>
        <a href="https://instagram.com/pouriaasghari_1" target="_blank" class="social-card-item" style="--clr: #e1306c;">
            <i class="fa-brands fa-instagram"></i>
            <div style="font-weight:700; margin-top:5px;">اینستاگرام</div>
            <div class="handle-text">@pouriaasghari_1</div>
        </a>
        <div class="social-card-item" style="--clr: #22c55e;">
            <i class="fa-solid fa-diamond-turn-right"></i>
            <div style="font-weight:700; margin-top:5px;">روبیکا</div>
            <div class="handle-text">pouriaasghari_1</div>
        </div>
    </div>

    <form onsubmit="event.preventDefault(); alert('درخواست شما برای پوریا اصغری ارسال گردید.'); this.reset();">
        <div class="form-item">
            <label>نام گرانقدر شما</label>
            <input type="text" class="form-field" required placeholder="مثال: امیرحسین سلیمی">
        </div>
        <div class="form-item">
            <label>شناسه یا شماره جهت تماس متقابل</label>
            <input type="text" class="form-field" required placeholder="آیدی یا ایمیل شما">
        </div>
        <div class="form-item">
            <label>جزئیات پیام سفارشی شما</label>
            <textarea class="form-field" rows="4" required placeholder="متن پیام خود را بنویسید..."></textarea>
        </div>
        <button type="submit" class="btn-glow" style="width:100%;">ثبت و ارسال پیام نئون</button>
    </form>
</div>


    <footer>
        <div class="footer-inner">
            <div class="footer-text">تمام استایل‌ها و ساختارها بر اساس الگوهای اختصاصی پوریا اصغری  طراحی شده است</div>
            <div class="logo" style="font-size:16px;">p_shop</div>
        </div>
    </footer>

    <script src="man.js"></script>
